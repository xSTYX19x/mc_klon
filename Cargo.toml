[package]
name = "mc_klon"
version = "0.0.1"
edition = "2024"
description = "Voxel sandbox engine in Rust with wgpu, chunk streaming and a region-file save format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xSTYX19x/mc_klon"
readme = "README.md"
publish = false

[features]
default = []
# Makes the JSON event stream (logs/run_*.trace.json) the default for this build.
# MC_KLON_TRACE=off|ring|full always overrides it at runtime.
perf_trace = []
# Referenced by src/meshing/liquids.rs; was never declared, so the feature could
# not be enabled at all.
allocation_tracking = []

[dependencies]
winit = "0.30"
wgpu = "28"
pollster = "0.4"
glam = "0.32"
bytemuck = { version = "1.16", features = ["derive"] }
image = "0.25"
anyhow = "1"
fastnoise-lite = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
crossbeam-channel = "0.5"
flate2 = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
